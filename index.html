<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATM Simulation</title>
<style>
  :root {
    --page: #dfe6ea;
    --body: #f4f7f8;
    --screen: #10303a;
    --screen-text: #f3b84b;
    --ink: #17252b;
    --muted: #5d6f77;
    --key: #ffffff;
    --key-edge: #b9c6cc;
    --ok: #1f7a4d;
    --bad: #b3372b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--page); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .atm {
    width: 100%; max-width: 440px; background: var(--body);
    border: 2px solid var(--key-edge); border-radius: 18px; padding: 22px;
  }
  .screen {
    background: var(--screen); color: var(--screen-text); border-radius: 10px;
    padding: 20px 22px; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .screen .holder { font-size: 0.95rem; opacity: 0.8; }
  .screen .balance { font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
  .screen .label { font-size: 0.9rem; opacity: 0.8; }
  #message { min-height: 1.4em; font-size: 0.98rem; margin-top: 14px; color: #e9eef0; }
  #message.error { color: #ff9c8f; }
  #message.success { color: #8fe0b4; }

  label { display: block; margin: 22px 0 8px; font-weight: 600; }
  input[type=number] {
    width: 100%; font: inherit; font-size: 1.3rem; padding: 12px 14px; border-radius: 8px;
    border: 2px solid var(--key-edge); background: #fff; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid #2a7f9e; outline-offset: 2px; }
  .quick { display: flex; gap: 8px; margin: 10px 0 18px; }
  .quick button {
    flex: 1; padding: 10px 0; font: inherit; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--key-edge); background: var(--key); color: var(--ink);
  }
  .quick button:hover { background: #eaf0f2; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button {
    padding: 14px; font: inherit; font-weight: 600; font-size: 1.05rem; border-radius: 8px; cursor: pointer;
    border: 0; color: #fff;
  }
  #deposit { background: var(--ok); }
  #withdraw { background: var(--screen); }
  .actions button:disabled { opacity: 0.5; cursor: progress; }
  .link {
    margin-top: 12px; width: 100%; background: none; border: 0; color: var(--muted);
    font: inherit; text-decoration: underline; cursor: pointer; padding: 8px;
  }
  h2 { font-size: 1rem; margin: 22px 0 8px; }
  #history { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
  #history li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--key-edge); }
  #history .empty { color: var(--muted); }
  .dep { color: var(--ok); } .wd { color: var(--bad); }
</style>
</head>
<body>
<main class="atm">
  <section class="screen" aria-live="polite">
    <div>
      <div class="holder" id="holder">Loading…</div>
      <div class="balance" id="balance">–</div>
      <div class="label">Available balance</div>
    </div>
    <div id="message"></div>
  </section>

  <label for="amount">Amount</label>
  <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
  <div class="quick">
    <button type="button" data-amt="100">100</button>
    <button type="button" data-amt="500">500</button>
    <button type="button" data-amt="1000">1000</button>
    <button type="button" data-amt="5000">5000</button>
  </div>

  <div class="actions">
    <button id="deposit">Deposit</button>
    <button id="withdraw">Withdraw</button>
  </div>
  <button class="link" id="check">Check balance</button>

  <h2>This session</h2>
  <ul id="history"><li class="empty">No transactions yet.</li></ul>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const money = (n) => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function show(text, kind) {
    const el = $("message");
    el.textContent = text;
    el.className = kind || "";
  }

  function addHistory(type, amount) {
    const list = $("history");
    if (list.querySelector(".empty")) list.innerHTML = "";
    const li = document.createElement("li");
    li.innerHTML = `<span>${type}</span><span class="${type === "Deposit" ? "dep" : "wd"}">${type === "Deposit" ? "+" : "−"}${money(amount)}</span>`;
    list.prepend(li);
  }

  async function call(path, method, body) {
    const res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed.");
    return data;
  }

  function render(data) {
    $("holder").textContent = data.holder;
    $("balance").textContent = money(data.balance);
  }

  async function transact(type, path) {
    const amount = parseFloat($("amount").value);
    if (isNaN(amount)) { show("Enter an amount.", "error"); return; }
    $("deposit").disabled = $("withdraw").disabled = true;
    try {
      const data = await call(path, "POST", { amount });
      render(data);
      show(data.message, "success");
      addHistory(type, amount);
      $("amount").value = "";
    } catch (err) {
      show(err.message, "error");
    } finally {
      $("deposit").disabled = $("withdraw").disabled = false;
    }
  }

  $("deposit").onclick = () => transact("Deposit", "/api/deposit");
  $("withdraw").onclick = () => transact("Withdrawal", "/api/withdraw");
  $("check").onclick = async () => {
    try { render(await call("/api/balance", "GET")); show("Balance updated.", "success"); }
    catch (err) { show(err.message, "error"); }
  };
  document.querySelectorAll(".quick button").forEach((b) => {
    b.onclick = () => { $("amount").value = b.dataset.amt; $("amount").focus(); };
  });

  call("/api/balance", "GET").then(render).catch(() => show("Cannot reach the ATM server.", "error"));
</script>
</body>
</html>
